@page zpaysage{size:A4 landscape;margin:8mm}
@page zportrait{size:A4 portrait;margin:8mm}
@page za3{size:A3 landscape;margin:8mm}
@media print{
  html.impression-zone body>*:not(#zone-impression){display:none!important}
  html.impression-zone #zone-impression{display:block!important;visibility:visible!important}
  html.impression-zone #zone-impression *{visibility:visible!important}
  html.impression-zone #zone-impression .report{position:static!important;width:auto!important}
  html.impression-zone #zone-impression[data-orientation=paysage]{page:zpaysage}
  html.impression-zone #zone-impression .planpage{box-shadow:none!important;zoom:.95;break-after:page}
  html.impression-zone #zone-impression .planpage.paysage{page:zpaysage}
  html.impression-zone #zone-impression .planpage.portrait{page:zportrait}
  html.impression-zone #zone-impression[data-format=A3] .planpage.paysage{page:za3}
}
@page fpaysage{size:A4 landscape;margin:10mm}
@page fportrait{size:A4 portrait;margin:10mm}

/* identifiants (0.15.0-alpha.1) : connexion, verrouillage, mots de passe, profils de droits */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;padding:24px;box-shadow:var(--shadow)}
.login-tete{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 12px;min-width:0}.login-tete>:first-child{flex:1 1 0;min-width:min-content}.login-tete>.langue-choix{flex:none;margin-top:4px;margin-left:auto}
.login-societe{display:flex;justify-content:center;align-items:center;padding:10px 0 2px;border-top:1px solid var(--line)}.login-societe img{margin:0 auto}
.login-titre{font:600 26px/1.2 var(--font-display,var(--font-serif));margin:4px 0 4px}
.login-err{border:1px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:8px;padding:8px 10px;font-size:13.5px}
.login-pied{font-size:11.5px;color:var(--ink2);margin:0;border-top:1px solid var(--line);padding-top:10px}
.login-aide>summary{list-style:none;cursor:pointer}.login-aide>summary::-webkit-details-marker{display:none}.login-aide[open]>summary{margin-bottom:4px}
.login-voile{position:fixed;inset:0;z-index:500;overflow:auto;background:var(--bg)}
.login-voile .toast{z-index:510}
.mdp-champ{position:relative;display:flex}.mdp-champ .inp{padding-right:44px}
.mdp-voir{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:16px;color:var(--ink2)}
.mdp-voir:hover{background:var(--surface2)}.mdp-voir:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mdp-jauge{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink2)}
.mdp-barres{display:inline-flex;gap:3px}.mdp-barres i{display:block;width:26px;height:5px;border-radius:3px;background:var(--line)}
.mdp-jauge[data-note="1"] .mdp-barres i.on{background:var(--bad)}.mdp-jauge[data-note="2"] .mdp-barres i.on{background:var(--warn)}
.mdp-jauge[data-note="3"] .mdp-barres i.on,.mdp-jauge[data-note="4"] .mdp-barres i.on{background:var(--ok)}
.code-secours{font:600 clamp(18px,5vw,26px)/1.3 var(--font-mono,ui-monospace,monospace);letter-spacing:.06em;text-align:center;padding:14px 10px;border:2px dashed var(--accent);border-radius:10px;background:var(--surface2);word-break:break-all;user-select:all}
.droits-grille{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.droits-ligne{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:7px 10px;border-bottom:1px solid var(--line)}
.droits-ligne:last-child{border-bottom:0}.droits-ligne:nth-child(even){background:var(--surface2)}
.droits-mod{font-size:14px;font-weight:500;min-width:0;flex:1 1 200px}
.droits-choix{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.droits-btn{border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink2);font:500 12.5px var(--font-body);padding:6px 11px;min-height:34px;cursor:pointer;white-space:nowrap}
.droits-btn:last-child{border-right:0}.droits-btn:disabled{cursor:default}
.droits-btn.on.aucun{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);font-weight:600}
.droits-btn.on.lecture{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--ink);font-weight:600}
.droits-btn.on.ecriture{background:var(--accentSoft,var(--surface2));color:var(--accent);font-weight:700}
.droits-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.droits-sp{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.droits-sp input{margin-top:2px}
@media (max-width:520px){.droits-btn{padding:6px 8px;font-size:12px}.login-card{padding:18px}}

/* formulaires d'opération personnalisables (0.16.0-alpha.1) */
.cf-req{color:var(--bad);font-weight:700}
.cf-masque{font-size:11px;color:var(--ink2);font-weight:400}
.cf-replie{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.cf-replie>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);list-style:none}
.cf-replie>summary::before{content:'▸ ';}.cf-replie[open]>summary::before{content:'▾ ';}
.cf-replie>summary::-webkit-details-marker{display:none}
.cf-barre{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 16px;font-size:13px;margin-top:-6px}
.cp-grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.cp-champ{min-width:0}.cp-champ.plein{grid-column:1/-1}
.cp-champ.hors .inp{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 25%,transparent)}
.cp-calc{min-height:40px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:16px}
.fe-liste{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.fe-ligne{border-bottom:1px solid var(--line);padding:8px 10px;background:var(--surface)}
.fe-liste .fe-ligne:last-child{border-bottom:0}.fe-liste .fe-ligne:nth-child(even){background:var(--surface2)}
[data-fe-persos] .fe-ligne{border:1px solid var(--line);border-radius:10px}
.fe-ligne.off .fe-nom b{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.fe-tete{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.fe-nom{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0;flex:1 1 220px;font-size:14px}
.fe-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fe-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fe-btn{border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink2);font:500 12.5px var(--font-body);padding:5px 10px;min-height:32px;cursor:pointer;white-space:nowrap}
.fe-btn:last-child{border-right:0}.fe-btn:disabled{cursor:default;opacity:.55}
.fe-btn.on.visible{background:var(--accentSoft,var(--surface2));color:var(--accent);font-weight:700}
.fe-btn.on.replie{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--ink);font-weight:600}
.fe-btn.on.masque{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);font-weight:600}
.fe-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fe-obl{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}.fe-obl.off{opacity:.5;cursor:default}
.fe-obl input{width:16px;height:16px;accent-color:var(--accent)}
.fe-detail{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fe-txt-c{display:none}
@media (max-width:520px){.fe-btn{padding:5px 10px;font-size:13px}.fe-txt,.fe-txt-o{display:none}.fe-txt-c{display:inline}.fe-ctl{gap:6px}}

/* 0.29.0-alpha.1 : fiches personnalisables, saisie groupée, fermentation, étiquettes QR, scanner, rappel de sauvegarde */
.rub-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rub-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-btn,8px);padding:6px 8px;background:var(--surface)}
.rub-item.off{opacity:.6;background:var(--surface2)}
.courbe{border:1px solid var(--line);border-radius:var(--r-card,6px);background:var(--surface);padding:6px 8px 4px}
.courbe-svg{width:100%;height:auto;display:block;max-height:280px}
.courbe-grille{stroke:var(--line);stroke-width:1}
.courbe-axe{font:11px Barlow,system-ui,sans-serif;fill:var(--ink2)}
.courbe-axe-t{fill:var(--ink2);opacity:.85}
.courbe-leg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 2px 4px}
.courbe-l{display:inline-block;width:22px;height:0;border-top:2.4px solid var(--accent);vertical-align:middle}
.courbe-l-t{border-top:1.6px dashed var(--accent)}
.pitem.is-sel{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tankcard.is-sel{outline:3px solid var(--accent);outline-offset:-1px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.selbar{position:sticky;bottom:0;z-index:40;margin:14px -16px 0;padding:10px 0;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 18px var(--shadow)}
.selbar .wrap{padding-left:16px;padding-right:16px}
.qr{display:inline-block;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.etq-scroll{overflow:auto;background:var(--surface2);border-radius:var(--r-card,6px);padding:12px}
.etiquettes{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.etq-page{background:#fff;color:#111;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.etq-page-a4{width:210mm;height:297mm;display:grid;grid-template-columns:repeat(3,70mm);grid-template-rows:repeat(8,37.125mm);align-content:start}
.etq-page-a6{width:105mm;height:148mm;display:flex}
.etq{box-sizing:border-box;display:flex;gap:2.5mm;overflow:hidden;font-family:Barlow,Arial,sans-serif;color:#111}
.etq-a4{padding:3.5mm 4mm;align-items:center}
.etq-a4 .etq-qr{width:29mm;height:29mm;flex:none}
.etq-a6{flex-direction:column;align-items:center;justify-content:center;width:100%;padding:8mm;text-align:center}
.etq-a6 .etq-qr{width:72mm;height:72mm}
.etq-txt{min-width:0;display:flex;flex-direction:column;gap:.6mm}
.etq-nom{font-weight:700;font-size:15pt;line-height:1.05;word-break:break-word}
.etq-a6 .etq-nom{font-size:30pt;margin-top:3mm}
.etq-sub{font-size:8.5pt;line-height:1.15;color:#333}
.etq-a6 .etq-sub{font-size:13pt}
.etq-ent{font-size:7.5pt;color:#555}
.etq-a6 .etq-ent{font-size:11pt}
.etq-pied{font-size:6.5pt;color:#666;margin-top:.8mm}
.etq-a6 .etq-pied{font-size:10pt;margin-top:3mm}
@page zetiq4{size:A4 portrait;margin:0}
@page zetiq6{size:A6 portrait;margin:0}
@media print{
  html.impression-zone #zone-impression[data-format=etiq-a4]{page:zetiq4}
  html.impression-zone #zone-impression[data-format=etiq-a6]{page:zetiq6}
  html.impression-zone #zone-impression .etiquettes{display:block;padding:0;gap:0}
  html.impression-zone #zone-impression .etq-page{box-shadow:none!important;break-after:page;margin:0}
}
.scan-cadre{position:relative;border-radius:var(--r-card,6px);overflow:hidden;background:#000;aspect-ratio:4/3;max-height:60vh}
.scan-video{width:100%;height:100%;object-fit:cover;display:block}
.scan-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;padding:16px;text-align:center}
.scan-viseur{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.rappel-sauv{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--warn);background:var(--warnSoft);border-radius:var(--r-btn,8px);padding:6px 10px;color:var(--ink)}
